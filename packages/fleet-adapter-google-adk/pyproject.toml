[project]
name = "fleet-adapter-google-adk"
version = "0.4.0"
description = "Google ADK and Model Armor Security Adapter for Fortified Enterprise Fleet"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=0.1.0",
    "pydantic>=2.7.0",
    "fleet-governance-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_adapter_google_adk"]
