[project]
name = "fleet-adapter-prodocux"
version = "0.3.0"
description = "ProDocuX Intake Adapter for Fortified Enterprise Fleet"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "requests>=2.31.0",
    "fleet-governance-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_adapter_prodocux"]
