[project]
name = "fleet-domain-cosmetics"
version = "0.4.0"
description = "Cosmetics PIF regulatory compliance domain logic and verifiers, toxicological MoS calculators, and INCI verifiers"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "fleet-governance-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_domain_cosmetics"]
