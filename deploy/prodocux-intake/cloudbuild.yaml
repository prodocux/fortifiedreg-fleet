steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/fortifiedreg/prodocux-intake:c8acd2b'
      - '-f'
      - 'Dockerfile'
      - '.'
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/fortifiedreg/prodocux-intake:c8acd2b'
options:
  logging: CLOUD_LOGGING_ONLY
