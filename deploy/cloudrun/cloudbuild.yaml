# ===========================================================================
# Google Cloud Build Pipeline for FortifiedReg Fleet
# Builds OCI-pinned container image, pushes to Artifact Registry, and deploys to Cloud Run.
# ===========================================================================

steps:
  # 1. Build Docker Image with dynamic Git Commit Build Arg
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'GIT_COMMIT=$COMMIT_SHA'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REPO/fleet:$SHORT_SHA'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REPO/fleet:latest'
      - '.'

  # 2. Push Docker Image to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REPO/fleet'

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REPO/fleet:$SHORT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=FLEET_ENV=production,FLEET_INTAKE_ADAPTER=live,FLEET_PDX_ADAPTER=live,PRODOCUX_BASE_URL=$_PRODOCUX_URL'
      - '--set-secrets=FLEET_JWT_SECRET=fleet-jwt-secret:latest'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--port=8080'

substitutions:
  _REGION: 'us-central1'
  _ARTIFACT_REPO: 'fortifiedreg'
  _SERVICE_NAME: 'fortifiedreg-fleet'
  _PRODOCUX_URL: 'https://prodocux-live.example.com'

images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REPO/fleet:$SHORT_SHA'
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REPO/fleet:latest'

options:
  logging: CLOUD_LOGGING_ONLY
