# ===========================================================================
# Google Cloud Build Pipeline for FortifiedReg Fleet (v0.3.2)
# Builds OCI-pinned container image, pushes to Artifact Registry, and deploys to Cloud Run.
# ===========================================================================

steps:
  # 0. Sentinel Verification: Ensure mandatory 40-character Git Commit and secure ProDocuX URL
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        FULL_COMMIT='$_GIT_COMMIT'
        SHORT_COMMIT='$_SHORT_COMMIT'
        PRODOCUX_URL='$_PRODOCUX_URL'

        if [[ "$$FULL_COMMIT" =~ ^[0-9a-fA-F]{40}$$ ]]; then
          echo "[✓] Verified 40-character Git Commit: $$FULL_COMMIT"
        else
          echo "[!] Error: _GIT_COMMIT must be an exact 40-character git commit SHA. Got: '$$FULL_COMMIT'" >&2
          exit 1
        fi

        EXPECTED_SHORT="$${FULL_COMMIT:0:12}"
        if [[ "$$SHORT_COMMIT" != "$$EXPECTED_SHORT" ]]; then
          echo "[!] Error: _SHORT_COMMIT '$$SHORT_COMMIT' does not match 12-char prefix of _GIT_COMMIT '$$EXPECTED_SHORT'" >&2
          exit 1
        fi

        # Strict Production URL policy: Must be HTTPS, no userinfo (@), no query (?), no fragment (#), no example.com
        if [[ -z "$$PRODOCUX_URL" || "$$PRODOCUX_URL" =~ example\.com || ! "$$PRODOCUX_URL" =~ ^https://[^@?#]+$$ ]]; then
          echo "[!] Error: _PRODOCUX_URL must be a live HTTPS URL without userinfo, query, or fragment ('$$PRODOCUX_URL')." >&2
          exit 1
        fi

  # 1. Build Docker Image with explicit Git Commit and Tag Build Args
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'GIT_COMMIT=$_GIT_COMMIT'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REPO/fleet:$_IMAGE_TAG-$_SHORT_COMMIT'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REPO/fleet:latest'
      - '.'

  # 2. Push Docker Image to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REPO/fleet'

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REPO/fleet:$_IMAGE_TAG-$_SHORT_COMMIT'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--service-account=fortifiedreg-fleet-runtime@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-env-vars=FLEET_ENV=production,FLEET_COMMIT=$_GIT_COMMIT,GIT_COMMIT=$_GIT_COMMIT,FLEET_INTAKE_ADAPTER=live,FLEET_PDX_ADAPTER=live,PDX_CORE_PIN=37e89752560b22dc8724d470dce96187f19e3f98,PRODOCUX_PIN=53c4784d4b2bae4437252a287193e897973e8474,PRODOCUX_BASE_URL=$_PRODOCUX_URL'
      - '--set-secrets=FLEET_JWT_SECRET=fleet-jwt-secret:latest'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--port=8080'

substitutions:
  _REGION: 'us-central1'
  _ARTIFACT_REPO: 'fortifiedreg'
  _SERVICE_NAME: 'fortifiedreg-fleet'
  _PRODOCUX_URL: 'REQUIRED_LIVE_PRODOCUX_URL'
  _GIT_COMMIT: 'REQUIRED_40_CHAR_GIT_COMMIT'
  _SHORT_COMMIT: 'REQUIRED_12_CHAR_SHORT_COMMIT'
  _IMAGE_TAG: 'v0.4.0'

images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REPO/fleet:$_IMAGE_TAG-$_SHORT_COMMIT'
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REPO/fleet:latest'

options:
  logging: CLOUD_LOGGING_ONLY
